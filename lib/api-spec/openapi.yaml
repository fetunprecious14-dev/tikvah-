openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Registration, login, and email verification
  - name: conversations
    description: A user's private conversations with the Tikvah team
  - name: notifications
    description: In-app notifications
  - name: resources
    description: The resource library
  - name: admin
    description: Admin-only conversation review and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Session ended

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with a verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Send a fresh verification email
      responses:
        "204":
          description: Verification email sent (if the account isn't already verified)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "204":
          description: If an account exists for that email, a reset email was sent (always 204, to avoid revealing whether an email is registered)

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated, session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List the signed-in user's conversations, most recent first
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a new conversation with an opening message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Read a conversation and its messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{id}/messages:
    post:
      operationId: createConversationMessage
      tags: [conversations]
      summary: Reply within an existing conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the signed-in user's notifications, most recent first
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: Browse the resource library
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/ResourceTopic"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ResourceType"
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/{id}/view:
    post:
      operationId: recordResourceView
      tags: [resources]
      summary: Record that a resource was opened (feeds admin "resource usage" analytics)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Recorded
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/conversations:
    get:
      operationId: adminListConversations
      tags: [admin]
      summary: List all conversations (admin)
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ConversationStatus"
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Conversations, urgent ones first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminConversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/conversations/{id}:
    get:
      operationId: adminGetConversation
      tags: [admin]
      summary: Read a conversation and its messages (admin)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminUpdateConversation
      tags: [admin]
      summary: Update a conversation's status or tags (admin)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchConversationRequest"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/conversations/{id}/messages:
    post:
      operationId: adminCreateConversationMessage
      tags: [admin]
      summary: Reply to a user within a conversation (admin)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Reply sent, user notified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/resources:
    get:
      operationId: adminListResources
      tags: [admin]
      summary: List resources for management (admin)
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/ResourceTopic"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ResourceType"
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminCreateResource
      tags: [admin]
      summary: Add a resource to the library (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/resources/{id}:
    patch:
      operationId: adminUpdateResource
      tags: [admin]
      summary: Edit a resource (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: adminDeleteResource
      tags: [admin]
      summary: Remove a resource from the library (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Resource deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/analytics:
    get:
      operationId: adminGetAnalytics
      tags: [admin]
      summary: Platform analytics (admin)
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Role:
      type: string
      enum: [user, admin]

    ConversationStatus:
      type: string
      enum: [awaiting_reply, responded, urgent, archived]

    SenderType:
      type: string
      enum: [user, admin]

    NotificationType:
      type: string
      enum: [reply, resource, maintenance]

    ResourceType:
      type: string
      enum: [article, book, video, podcast, verse, exercise, prompt, tip]

    ResourceTopic:
      type: string
      enum:
        - anxiety
        - grief
        - purpose
        - relationships
        - depression
        - stress
        - faith
        - healing
        - self-worth

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, emailVerified, createdAt]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]

    RequestPasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 200
      required: [token, password]

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderType:
          $ref: "#/components/schemas/SenderType"
        senderName:
          type: string
        body:
          type: string
        riskCategories:
          type: array
          items:
            type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, senderType, senderName, body, createdAt]

    CreateMessageRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
      required: [body]

    CreateConversationRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
      required: [body]

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ConversationStatus"
        tags:
          type: array
          items:
            type: string
        preview:
          type: string
        lastMessageAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, status, tags, preview, lastMessageAt, createdAt]

    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
          required: [messages]

    ConversationUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      required: [id, name, email]

    AdminConversation:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/ConversationUser"
          required: [user]

    AdminConversationDetail:
      allOf:
        - $ref: "#/components/schemas/AdminConversation"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
          required: [messages]

    PatchConversationRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ConversationStatus"
        tags:
          type: array
          items:
            type: string

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        body:
          type: string
        conversationId:
          type: string
          format: uuid
          nullable: true
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, type, title, body, conversationId, read, createdAt]

    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/ResourceType"
        topic:
          $ref: "#/components/schemas/ResourceTopic"
        url:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, title, description, type, topic, url, body, createdAt]

    CreateResourceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 500
        type:
          $ref: "#/components/schemas/ResourceType"
        topic:
          $ref: "#/components/schemas/ResourceTopic"
        url:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
      required: [title, description, type, topic]

    UpdateResourceRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 500
        type:
          $ref: "#/components/schemas/ResourceType"
        topic:
          $ref: "#/components/schemas/ResourceTopic"
        url:
          type: string
          nullable: true
        body:
          type: string
          nullable: true

    Analytics:
      type: object
      properties:
        totalUsers:
          type: integer
        activeUsers30d:
          type: integer
        newRegistrations7d:
          type: integer
        totalConversations:
          type: integer
        awaitingReplyCount:
          type: integer
        urgentCount:
          type: integer
        respondedCount:
          type: integer
        archivedCount:
          type: integer
        avgResponseTimeMinutes:
          type: number
          nullable: true
        resourceViews30d:
          type: integer
      required:
        - totalUsers
        - activeUsers30d
        - newRegistrations7d
        - totalConversations
        - awaitingReplyCount
        - urgentCount
        - respondedCount
        - archivedCount
        - avgResponseTimeMinutes
        - resourceViews30d
